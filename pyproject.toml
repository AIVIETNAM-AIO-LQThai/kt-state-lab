[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kt-state-lab"
version = "0.1.0"
description = "Knowledge Tracing state lab: reproducible data, splits, and evaluation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ktlab-data = "ktlab.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
